<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <!-- 山河策 · 占位应用图标（印章风：暗金底 + 篆刻印 + 山河） -->
  <rect width="128" height="128" rx="16" fill="#2B2014"/>
  <rect x="6" y="6" width="116" height="116" rx="11" fill="none" stroke="#C8A84E" stroke-width="3"/>
  <!-- 山 -->
  <polygon points="22,78 44,44 58,64 70,50 106,78" fill="#3E4A3B"/>
  <polygon points="44,44 50,55 44,52 40,55" fill="#55684F"/>
  <!-- 河 -->
  <path d="M18,88 Q40,80 64,88 T110,86" fill="none" stroke="#4A7B9A" stroke-width="4" stroke-linecap="round"/>
  <!-- 印章 -->
  <rect x="42" y="38" width="44" height="44" rx="6" fill="#A03A2E"/>
  <rect x="46" y="42" width="36" height="36" rx="4" fill="none" stroke="#E8D5B0" stroke-width="2"/>
  <!-- 篆刻 "山河" -->
  <text x="64" y="63" font-family="serif" font-size="22" font-weight="bold" fill="#E8D5B0" text-anchor="middle">山</text>
  <text x="64" y="78" font-family="serif" font-size="14" fill="#E8D5B0" text-anchor="middle">山河策</text>
</svg>
